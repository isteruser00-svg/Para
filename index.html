<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benimle Çıkar Mısın? ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#fce4ec,#f8bbd0,#f48fb1);
font-family:'Segoe UI',sans-serif;
overflow:hidden;
}
.card{
background:rgba(255,255,255,.9);
padding:40px 25px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
width:90%;
max-width:420px;
}
h1{color:#ad1457;font-size:2rem;margin-bottom:30px}
.btn-container{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
min-height:120px;
position:relative;
}
button{
padding:14px 25px;
font-size:1.1rem;
font-weight:bold;
border:0;
border-radius:50px;
cursor:pointer;
}
#yes-btn{background:#e91e63;color:white;z-index:2}
#no-btn{background:#78909c;color:white;z-index:10}
.rocket{
position:absolute;
font-size:3.5rem;
transition:transform 1.5s ease,opacity 1s ease;
pointer-events:none;
z-index:20;
}
.rocket-fly{transform:translateY(-800px) scale(1.5);opacity:0}
#result-message{
display:none;
margin-top:20px;
font-size:1.25rem;
color:#880e4f;
font-weight:600;
line-height:1.5;
animation:fadeIn 1s ease forwards;
}
@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>
<div class="card">
<h1 id="question">Benimle çıkar mısın? ❤️</h1>

<div class="btn-container" id="btn-container">
<button id="yes-btn">Evet 💖</button>
<button id="no-btn">Hayır 😅</button>
</div>

<div id="result-message"></div>
</div>

<script>
const noBtn=document.getElementById('no-btn');
const yesBtn=document.getElementById('yes-btn');
const question=document.getElementById('question');
const btnContainer=document.getElementById('btn-container');
const resultMessage=document.getElementById('result-message');

let noClickCount=0;

function handleNoInteraction(e){
e.preventDefault();
noClickCount++;

if(noClickCount<4){
const containerRect=btnContainer.getBoundingClientRect();
const btnRect=noBtn.getBoundingClientRect();

const maxX=containerRect.width-btnRect.width;
const maxY=containerRect.height-btnRect.height;

const randomX=Math.random()*maxX-maxX/2;
const randomY=Math.random()*maxY-maxY/2;

noBtn.style.position='absolute';
noBtn.style.transform=`translate(${randomX}px,${randomY}px)`;

}else if(noClickCount===4){
const rocket=document.createElement('div');
rocket.className='rocket';
rocket.innerHTML='🚀';

rocket.style.left=(noBtn.offsetLeft+noBtn.offsetWidth/2-25)+'px';
rocket.style.top=(noBtn.offsetTop+noBtn.offsetHeight)+'px';

btnContainer.appendChild(rocket);

setTimeout(()=>{
rocket.classList.add('rocket-fly');
noBtn.style.opacity='0';
noBtn.style.pointerEvents='none';
},100);

setTimeout(()=>{
rocket.remove();
noBtn.remove();
},1600);
}
}

noBtn.addEventListener('click',handleNoInteraction);

yesBtn.addEventListener('click',()=>{
btnContainer.style.display='none';
question.innerText='Sonsuza Kadar Evet! ✨';

resultMessage.innerHTML='Gökyüzündeki tüm yıldızlar bir araya gelse, senin gözlerindeki o tek bir ışıltı kadar güzel aydınlatamazdı dünyamı... İyi ki varsın! 🌹✨';

resultMessage.style.display='block';

const duration=3000;
const animationEnd=Date.now()+duration;

const defaults={
startVelocity:30,
spread:360,
ticks:60,
zIndex:100
};

function randomInRange(min,max){
return Math.random()*(max-min)+min;
}

const interval=setInterval(()=>{
const timeLeft=animationEnd-Date.now();

if(timeLeft<=0){
clearInterval(interval);
return;
}

const particleCount=50*(timeLeft/duration);

confetti({
...defaults,
particleCount,
origin:{
x:randomInRange(.1,.3),
y:Math.random()-.2
},
colors:['#e91e63','#ff4081','#ff80ab','#ffffff']
});

confetti({
...defaults,
particleCount,
origin:{
x:randomInRange(.7,.9),
y:Math.random()-.2
},
colors:['#e91e63','#ff4081','#ff80ab','#ffffff']
});
},250);
});
</script>
</body>
</html>
